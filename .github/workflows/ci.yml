name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt into more only when needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version-coherence:
    name: Version coherence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install verifier dependencies
        run: bun install --frozen-lockfile
      # Read-only guard: the crate version (src-tauri/Cargo.toml), the
      # package.json version, and the CITATION.cff version must all agree.
      # Catches a release that bumps one metadata file but forgets another.
      # On a tag push it also asserts the tag peels to its commit and that the
      # tag's version matches the in-tree version.
      - name: Internal version coherence (HEAD)
        run: scripts/check-version-coherence.sh
      - name: NCP consumer coherence (HEAD)
        run: bun run check:ncp-coherence
      - name: Phase 0 assurance baseline and fail-closed self-test (HEAD)
        run: node scripts/verify-phase0-baseline.mjs && node scripts/test-phase0-baseline.mjs
      - name: Version coherence (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: scripts/check-version-coherence.sh --expected-commit "$GITHUB_SHA" "${GITHUB_REF_NAME}"

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate frontend (typecheck, lint, format, tests)
        run: |
          set -o pipefail
          bun run validate 2>&1 | tee frontend-validation.log

      - name: Build + bundle-size budget
        run: bun run check:bundle

      - name: Install Chromium for responsive smoke test
        run: bunx playwright install --with-deps chromium

      - name: Responsive production-browser smoke test
        run: bun run test:responsive

      - name: Record frontend validation summary
        if: always()
        run: |
          {
            echo "### Frontend validation"
            echo ""
            echo "- Commands: \`bun run validate\`, \`bun run check:bundle\`, and \`bun run test:responsive\`"
            echo ""
            echo "\`\`\`"
            grep -E "Test Files|Tests|tsc --noEmit|within budget" frontend-validation.log || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    name: Frontend coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Coverage (enforces thresholds in vite.config.ts)
        run: |
          set -o pipefail
          bun run test:coverage 2>&1 | tee coverage.log
      - name: Record coverage summary
        if: always()
        run: |
          {
            echo "### Frontend coverage"
            echo ""
            echo "\`\`\`"
            grep -E "All files|Statements|Branches|Functions|Lines" coverage.log || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend (Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        # Keep in sync with rust-toolchain.toml (the action's RUSTUP_TOOLCHAIN
        # export would otherwise override the repo's pinned toolchain file).
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.91.1
          components: clippy, rustfmt

      # ort-sys rc.12 derives this path from the Xcode clang major version.
      # Some macos-latest images keep the runtime under a versioned resource
      # directory instead, so provide the authoritative path reported by clang.
      - name: Locate macOS clang runtime
        if: runner.os == 'macOS'
        run: |
          CLANG_RT_DIR="$(xcrun clang --print-resource-dir)/lib/darwin"
          test -e "$CLANG_RT_DIR/libclang_rt.osx.a"
          echo "RUSTFLAGS=-Lnative=$CLANG_RT_DIR" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$CLANG_RT_DIR${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rustfmt
        run: |
          set -o pipefail
          bun run fmt:rust:check 2>&1 | tee rust-fmt.log

      - name: Check Rust
        run: |
          set -o pipefail
          bun run check:rust 2>&1 | tee rust-check.log

      - name: Clippy
        run: |
          set -o pipefail
          bun run clippy:rust 2>&1 | tee rust-clippy.log

      # The dormant NCP bridge and runtime-gated Galadriel producer live behind
      # `ncp`, so default checks do not compile them. Lint the complete Tauri
      # feature surface. Clippy also catches build breaks.
      - name: Clippy NCP bridge and Galadriel producer (feature `ncp`)
        run: |
          set -o pipefail
          bun run clippy:rust:ncp 2>&1 | tee rust-ncp.log

      # clippy:rust:ncp only compiles + lints; run the bridge, registry, codec,
      # fusion-ledger, bounded-queue, heartbeat, and lifecycle unit tests too.
      # First build here pulls Zenoh (ncp-zenoh), so allow extra time on a cold
      # cache; rust-cache above keeps subsequent runs fast.
      - name: Test NCP bridge and Galadriel producer (feature `ncp`)
        timeout-minutes: 30
        run: |
          set -o pipefail
          bun run test:rust:ncp 2>&1 | tee rust-ncp-test.log

      # The external runner is a separate default-empty workspace package. Test
      # its binary, CLI, lifecycle, and dependency boundary independently from
      # the Tauri package.
      - name: Verify isolated headless NCP dependency boundary
        run: |
          set -o pipefail
          bun run check:ncp-headless-boundary 2>&1 | tee rust-ncp-headless-boundary.log

      - name: Clippy isolated headless NCP runner
        run: |
          set -o pipefail
          bun run clippy:ncp-headless 2>&1 | tee rust-ncp-headless-clippy.log

      - name: Test isolated headless NCP runner
        timeout-minutes: 30
        run: |
          set -o pipefail
          bun run test:ncp-headless 2>&1 | tee rust-ncp-headless-test.log

      - name: Self-check isolated headless NCP runner
        run: |
          set -o pipefail
          bun run self-check:ncp-headless 2>&1 | tee rust-ncp-headless-self-check.log

      - name: Validate native local scalar adapter
        timeout-minutes: 30
        run: |
          set -o pipefail
          bun run validate:ncp-simulation 2>&1 | tee rust-ncp-simulation.log

      - name: Run tests
        run: |
          set -o pipefail
          bun run test:rust 2>&1 | tee rust-test.log

      - name: Record backend validation summary
        if: always()
        run: |
          {
            echo "### Backend validation (${{ matrix.os }})"
            echo ""
            echo "- Commands: \`fmt:rust:check\`, \`check:rust\`, \`clippy:rust\`, \`clippy:rust:ncp\`, \`test:rust\`, \`test:rust:ncp\`, \`check:ncp-headless-boundary\`, \`clippy:ncp-headless\`, \`test:ncp-headless\`, \`self-check:ncp-headless\`, \`validate:ncp-simulation\`"
            echo ""
            echo "\`\`\`"
            grep -E "test result:|Finished|error:|OK:|crebain_ncp_headless_self_check" rust-check.log rust-clippy.log rust-test.log rust-ncp.log rust-ncp-test.log rust-ncp-headless-boundary.log rust-ncp-headless-clippy.log rust-ncp-headless-test.log rust-ncp-headless-self-check.log rust-ncp-simulation.log || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  managed-simulation:
    name: Managed simulation bootstrap gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.91.1
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - name: Assert exact Rust toolchain
        run: |
          test "$(uname -m)" = "arm64"
          test "$(rustc --version)" = "rustc 1.91.1 (ed61e7d7e 2025-11-07)"
          test "$(cargo --version)" = "cargo 1.91.1 (ea2d97820 2025-10-10)"
      - name: Cache managed-simulation Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Observe clean immutable main build and stage exact bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          python3 scripts/build-managed-simulation-bootstrap.py --commit "$GITHUB_SHA" 2>&1 | tee managed-bootstrap.log
          python3 scripts/stage-managed-simulation-package.py 2>&1 | tee managed-stage.log
      - name: Verify provider-free boundary, copied contracts, packaging tools, and tracked inputs
        run: |
          set -o pipefail
          bun run check:managed-simulation-boundary 2>&1 | tee managed-boundary.log
          bun run check:managed-simulation-inputs 2>&1 | tee managed-inputs.log
      - name: Build and replay private-pipe contracts
        run: |
          set -o pipefail
          bun run check:managed-simulation-contract 2>&1 | tee managed-contract.log
      - name: Format, test, and lint the isolated runtime
        run: |
          set -o pipefail
          bun run fmt:managed-simulation:check 2>&1 | tee managed-format.log
          bun run check:managed-simulation-rust 2>&1 | tee managed-check.log
          bun run test:managed-simulation 2>&1 | tee managed-test.log
          bun run clippy:managed-simulation 2>&1 | tee managed-clippy.log
          bun run doc:managed-simulation 2>&1 | tee managed-rustdoc.log
      - name: Record managed-simulation validation summary
        if: always()
        run: |
          {
            echo "### Managed simulation bootstrap gate"
            echo ""
            echo "- Rust: exact 1.91.1"
            echo "- Scope: simulator-only Host API 2.0; NCP and MUSIC remain outside this runtime"
            echo ""
            echo "\`\`\`"
            grep -E "test result:|Finished|error:|OK:|status.*verified" managed-*.log || true
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  backend-features:
    name: Backend feature gates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.91.1
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # ort uses load-dynamic, so the cuda/tensorrt features compile without the
      # CUDA SDK present (the EP is resolved at runtime). This guards the
      # feature-gated code paths from rotting.
      - name: cargo check --features cuda,tensorrt
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features cuda,tensorrt
      # The disabled-Zenoh stub is separate code and must continue to satisfy
      # the Transport trait when consumers build a minimal feature set.
      - name: cargo check --no-default-features
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --no-default-features

  plant-authority-foundation:
    name: Inert plant authority boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.91.1
          components: clippy, rustfmt
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Verify package and dependency boundary
        run: bun run check:plant-boundary
      - name: Verify frame-convention corpus
        run: bun run check:plant-frames
      - name: Check plant Rust formatting
        run: bun run fmt:plant:check
      - name: Check, lint, and test inert kernel
        run: |
          bun run check:plant
          bun run clippy:plant
          bun run test:plant
      - name: Run headless self-check
        run: bun run self-check:plant
