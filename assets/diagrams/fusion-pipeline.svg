<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-label="CREBAIN sensor fusion pipeline">
  <title>CREBAIN sensor fusion pipeline</title>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#9caf88"/>
    </marker>
    <marker id="ahs" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="ahg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6e7681"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #c9d1d9; text-anchor: middle; }
    .ttl { font-size: 13px; letter-spacing: 2px; text-anchor: start; }
    .ls  { text-anchor: start; }
    .dim { fill: #8b949e; }
    .sky { fill: #38bdf8; }
    .em  { fill: #34d399; }
    .am  { fill: #fbbf24; }
    .vi  { fill: #a78bfa; }
    .rd  { fill: #ef4444; }
    .sg  { fill: #b6cf86; }
    .box   { fill: #0d1117; stroke: #9caf88; stroke-width: 1.2; }
    .bsrc  { stroke: #728a49; }
    .bem   { stroke: #34d399; }
    .bdash { stroke: #38bdf8; stroke-width: 1; stroke-dasharray: 5 4; }
    .bgray { stroke: #6e7681; stroke-width: 1; stroke-dasharray: 5 4; }
    .fl  { fill: none; stroke: #9caf88; stroke-width: 1.2; marker-end: url(#ah); }
    .fld { fill: none; stroke: #38bdf8; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#ahs); }
    .flg { fill: none; stroke: #6e7681; stroke-width: 1.2; stroke-dasharray: 5 4; marker-end: url(#ahg); }
    .brk { fill: none; stroke: #728a49; stroke-width: 1.5; }
    .key  { fill: none; stroke: #9caf88; stroke-width: 1.2; }
    .keyd { fill: none; stroke: #38bdf8; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>

  <rect x="0" y="0" width="1080" height="500" fill="#0d1117"/>

  <!-- corner brackets -->
  <path class="brk" d="M12 26 V12 H26"/>
  <path class="brk" d="M1054 12 H1068 V26"/>
  <path class="brk" d="M12 474 V488 H26"/>
  <path class="brk" d="M1068 474 V488 H1054"/>

  <text class="ttl" x="40" y="32">CREBAIN · NATIVE SENSOR-FUSION PIPELINE</text>

  <!-- legend -->
  <line class="key"  x1="800" y1="24" x2="832" y2="24"/>
  <text class="ls dim" x="840" y="28">SOLID = NORMATIVE NATIVE PATH</text>
  <line class="keyd" x1="800" y1="42" x2="832" y2="42"/>
  <text class="ls dim" x="840" y="46">DASHED = OPTIONAL / GATED</text>

  <!-- measurement sources -->
  <text class="ls sky" x="16" y="60">MEASUREMENT SOURCES</text>
  <rect class="box bsrc" x="16" y="72"  width="152" height="48"/>
  <text class="sky" x="92" y="92">RADAR</text>
  <text class="dim" x="92" y="108">POLAR [M, RAD, RAD]</text>
  <rect class="box bsrc" x="16" y="126" width="152" height="48"/>
  <text class="sky" x="92" y="146">LIDAR</text>
  <text class="dim" x="92" y="162">CARTESIAN M</text>
  <rect class="box bsrc" x="16" y="180" width="152" height="48"/>
  <text class="sky" x="92" y="200">THERMAL</text>
  <text class="dim" x="92" y="216">CARTESIAN M</text>
  <rect class="box bsrc" x="16" y="234" width="152" height="48"/>
  <text class="sky" x="92" y="254">ACOUSTIC</text>
  <text class="dim" x="92" y="270">CARTESIAN M</text>
  <rect class="box bsrc" x="16" y="288" width="152" height="48"/>
  <text class="sky" x="92" y="308">RF</text>
  <text class="dim" x="92" y="324">CARTESIAN M</text>
  <rect class="box bsrc" x="16" y="342" width="152" height="48"/>
  <text class="sky" x="92" y="362">VISUAL</text>
  <text class="dim" x="92" y="378">CARTESIAN M</text>

  <line class="fl" x1="168" y1="96"  x2="192" y2="160"/>
  <line class="fl" x1="168" y1="150" x2="192" y2="190"/>
  <line class="fl" x1="168" y1="204" x2="192" y2="220"/>
  <line class="fl" x1="168" y1="258" x2="192" y2="250"/>
  <line class="fl" x1="168" y1="312" x2="192" y2="280"/>
  <line class="fl" x1="168" y1="366" x2="192" y2="310"/>

  <!-- measurement intake -->
  <rect class="box bem" x="196" y="140" width="140" height="190"/>
  <text class="em"  x="266" y="195">MEASUREMENT</text>
  <text class="em"  x="266" y="211">INTAKE</text>
  <text class="dim" x="266" y="227">EXACT-TIME</text>
  <text class="dim" x="266" y="243">GROUPING</text>
  <text class="dim" x="266" y="259">BOUNDED</text>
  <text class="dim" x="266" y="275">&#8804;512/BATCH</text>

  <line class="fl" x1="336" y1="232" x2="352" y2="232"/>

  <!-- main pipeline -->
  <rect class="box" x="360" y="196" width="96" height="72"/>
  <text class="am"  x="408" y="226">PREDICT</text>
  <text class="dim" x="408" y="242">CV MODEL</text>

  <line class="fl" x1="456" y1="232" x2="466" y2="232"/>

  <rect class="box" x="472" y="196" width="124" height="72"/>
  <text class="am"  x="534" y="219">GATE</text>
  <text class="dim" x="534" y="235">MAHALANOBIS</text>
  <text class="dim" x="534" y="251">&#967;&#178;(3) &#183; 11.345</text>

  <line class="fl" x1="596" y1="232" x2="606" y2="232"/>

  <rect class="box" x="612" y="196" width="124" height="72"/>
  <text class="am"  x="674" y="219">ASSOCIATE</text>
  <text class="dim" x="674" y="235">CLUSTER +</text>
  <text class="dim" x="674" y="251">HUNGARIAN</text>

  <line class="fl" x1="736" y1="232" x2="746" y2="232"/>

  <rect class="box" x="752" y="196" width="150" height="72"/>
  <text class="am"  x="827" y="219">UPDATE</text>
  <text class="dim" x="827" y="235">SEQUENTIAL,</text>
  <text class="dim" x="827" y="251">PER-MEASUREMENT R</text>

  <line class="fl" x1="902" y1="232" x2="912" y2="232"/>

  <rect class="box" x="918" y="196" width="146" height="72"/>
  <text class="am"  x="991" y="219">INITIATE +</text>
  <text class="am"  x="991" y="235">LIFECYCLE</text>
  <text class="dim" x="991" y="251">M-OF-N 3-OF-5</text>

  <!-- selectable filters -->
  <text class="vi" x="827" y="292">KF &#183; EKF (DEFAULT)</text>
  <text class="vi" x="827" y="307">UKF &#183; PF &#183; IMM</text>

  <!-- lifecycle mini-strip -->
  <line class="fl" x1="991" y1="268" x2="991" y2="278"/>
  <text class="sg" x="991" y="292">TENTATIVE &#8594; CONFIRMED</text>
  <text class="sg" x="991" y="307">&#8594; COASTING &#8594; LOST</text>
  <line class="fl" x1="991" y1="314" x2="991" y2="336"/>

  <!-- track output -->
  <rect class="box bem" x="896" y="340" width="164" height="52"/>
  <text class="em" x="978" y="361">TRACK OUTPUT &#8594;</text>
  <text x="978" y="377">SENSOR FUSION PANEL</text>

  <!-- gated evidence branch -->
  <line class="fld" x1="760" y1="268" x2="760" y2="336"/>
  <rect class="box bdash" x="560" y="340" width="242" height="52"/>
  <text class="sky" x="681" y="361">EMIT_INNOVATIONS &#8594;</text>
  <text class="dim" x="681" y="377">JSONL / GALADRIEL ROUTES &#183; GATED</text>

  <!-- separate browser estimator -->
  <rect class="box bgray" x="16" y="414" width="214" height="64"/>
  <text x="123" y="435">BROWSER MULTI-CAMERA MODULE</text>
  <text class="dim" x="123" y="451">SEPARATE GEOMETRIC ESTIMATOR</text>
  <text class="rd" x="123" y="467">NOT A PARITY ORACLE</text>
  <line class="flg" x1="91" y1="412" x2="91" y2="396"/>
  <text class="ls dim" x="104" y="406">FINITE TRIANGULATION ONLY</text>
</svg>
