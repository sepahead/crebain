<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
<title id="title">CREBAIN: controlled branches and actual observations</title>
<desc id="desc">A parent stops at tick 24. Two baseline siblings and one intervention sibling advance through tick 84. Matching siblings and reversed execution orders agree exactly. Three plots show the intervention's position, temperature, and microphone differences in one selected engineering campaign. This is not physical calibration or an independent statistical experiment.</desc>
