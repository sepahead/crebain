<svg xmlns="http://www.w3.org/2000/svg" width="820" height="418" viewBox="0 0 820 418" role="img" aria-labelledby="title description">
  <title id="title">Separate sensors, one declared clock</title>
  <desc id="description">Six body ticks at 120 ticks per second. RGB camera a emits at ticks 2, 4, and 6. RGB camera b emits at ticks 3 and 6. One microphone emits 133, 133, 134, 133, 133, and 134 pressure samples. An optional thermal camera emits at ticks 3 and 6. Circles with no fill mean a configured camera is not due. Sensor identity does not define statistical source grouping.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#142832"/><stop offset="1" stop-color="#0b121b"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#73e0b2"/><stop offset="1" stop-color="#79cfff"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="818" height="416" rx="18" fill="url(#panel)" stroke="#405665"/>
  <path d="M28 72H792" stroke="url(#accent)" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="28" y="34" fill="#edf6fc" font-size="23" font-weight="650">Separate sensors, one declared clock</text>
    <text x="28" y="57" fill="#b9cbd6" font-size="14">One NCP endpoint · six complete batches · 0.05 simulated second</text>
    <text x="28" y="102" fill="#9bb3c2" font-size="13">SENSOR INSTANCE</text>
    <g fill="#b9cbd6" text-anchor="middle" font-size="14">
      <text x="310" y="103">1</text><text x="394" y="103">2</text>
      <text x="478" y="103">3</text><text x="562" y="103">4</text>
      <text x="646" y="103">5</text><text x="730" y="103">6</text>
    </g>
    <g stroke="#29414e" stroke-width="1">
      <path d="M310 116V338M394 116V338M478 116V338M562 116V338M646 116V338M730 116V338" stroke-dasharray="2 5"/>
      <path d="M274 143H766M274 203H766M274 263H766M274 323H766"/>
    </g>
    <g font-size="16" font-weight="600">
      <text x="28" y="140" fill="#83e8bc">rgb-a</text>
      <text x="28" y="200" fill="#86d5ff">rgb-b</text>
      <text x="28" y="260" fill="#f2cd7e">mic-a</text>
      <text x="28" y="320" fill="#d0bafa">thermal-a · optional</text>
    </g>
    <g fill="#adc0cd" font-size="13">
      <text x="28" y="160">One frame every 2 ticks</text>
      <text x="28" y="220">One frame every 3 ticks</text>
      <text x="28" y="280">Pressure samples per window</text>
      <text x="28" y="340">One frame every 3 ticks</text>
    </g>
    <g stroke="#83e8bc" stroke-width="2">
      <g fill="#0e1b24"><circle cx="310" cy="143" r="10"/><circle cx="478" cy="143" r="10"/><circle cx="646" cy="143" r="10"/></g>
      <g fill="#83e8bc"><circle cx="394" cy="143" r="10"/><circle cx="562" cy="143" r="10"/><circle cx="730" cy="143" r="10"/></g>
    </g>
    <g stroke="#86d5ff" stroke-width="2">
      <g fill="#0e1b24"><circle cx="310" cy="203" r="10"/><circle cx="394" cy="203" r="10"/><circle cx="562" cy="203" r="10"/><circle cx="646" cy="203" r="10"/></g>
      <g fill="#86d5ff"><circle cx="478" cy="203" r="10"/><circle cx="730" cy="203" r="10"/></g>
    </g>
    <g fill="#3d3424" stroke="#e6bc65">
      <rect x="281" y="247" width="58" height="31" rx="6"/><rect x="365" y="247" width="58" height="31" rx="6"/>
      <rect x="449" y="247" width="58" height="31" rx="6"/><rect x="533" y="247" width="58" height="31" rx="6"/>
      <rect x="617" y="247" width="58" height="31" rx="6"/><rect x="701" y="247" width="58" height="31" rx="6"/>
    </g>
    <g fill="#ffe3a6" text-anchor="middle" font-size="14" font-weight="600">
      <text x="310" y="268">133</text><text x="394" y="268">133</text><text x="478" y="268">134</text>
      <text x="562" y="268">133</text><text x="646" y="268">133</text><text x="730" y="268">134</text>
    </g>
    <g stroke="#d0bafa" stroke-width="2">
      <g fill="#0e1b24"><circle cx="310" cy="323" r="10"/><circle cx="394" cy="323" r="10"/><circle cx="562" cy="323" r="10"/><circle cx="646" cy="323" r="10"/></g>
      <g fill="#d0bafa"><circle cx="478" cy="323" r="10"/><circle cx="730" cy="323" r="10"/></g>
    </g>
    <path d="M28 359H792" stroke="#3a505e"/>
    <circle cx="35" cy="380" r="6" fill="#dcebf4"/>
    <circle cx="142" cy="380" r="6" fill="none" stroke="#dcebf4" stroke-width="1.5"/>
    <g fill="#c6d8e3" font-size="13">
      <text x="49" y="385">Frame due</text><text x="156" y="385">Not due</text>
      <text x="310" y="385">Time at tick k = k / 120 seconds</text>
      <text x="28" y="405" font-size="12">Camera identities remain distinct. An experiment declares whether their features form separate or joint variables.</text>
    </g>
  </g>
</svg>
