<svg xmlns="http://www.w3.org/2000/svg" xml:lang="en" viewBox="0 0 1200 720" width="1200" height="720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="system-architecture-title system-architecture-desc">
  <title id="system-architecture-title">CREBAIN current system architecture</title>
  <desc id="system-architecture-desc">The React frontend uses Tauri inter-process communication to reach Rust inference, sensor fusion, and read-only telemetry transports. A feature-gated producer can make local puts to two advisory NCP routes, but receiver delivery is not established. The separate plant foundation is inert and has no authority path.</desc>
  <style>
    * { vector-effect: non-scaling-stroke; }
    .canvas { fill: #f8fafc; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #172033; text-anchor: middle; }
    .title { font-size: 18px; font-weight: 700; letter-spacing: 2px; text-anchor: start; }
    .subtitle { font-size: 13px; fill: #475569; text-anchor: start; }
    .region-label { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; text-anchor: start; }
    .small { font-size: 13px; fill: #475569; }
    .left { text-anchor: start; }
    .present-text { fill: #047857; }
    .data-text { fill: #0369a1; }
    .conditional-text { fill: #92400e; }
    .optional-text { fill: #6d28d9; }
    .absent-text { fill: #b91c1c; }
    .surface { fill: #ffffff; stroke: #52643f; stroke-width: 1.4; }
    .region { fill: none; stroke-width: 1.6; }
    .frontend { stroke: #047857; }
    .backend { stroke: #92400e; }
    .external { stroke: #0369a1; }
    .optional-box { stroke: #6d28d9; stroke-dasharray: 7 5; }
    .absent-box { fill: #ffffff; stroke: #b91c1c; stroke-width: 1.6; stroke-dasharray: 3 4; }
    .ipc { fill: #ffffff; stroke: #52643f; stroke-width: 1.8; }
    .edge { fill: none; stroke: #52643f; stroke-width: 1.5; marker-end: url(#system-arrow-flow); }
    .data-edge { fill: none; stroke: #0369a1; stroke-width: 1.5; marker-end: url(#system-arrow-data); }
    .optional-edge { fill: none; stroke: #6d28d9; stroke-width: 1.5; stroke-dasharray: 7 5; marker-end: url(#system-arrow-optional); }
    .barrier { stroke: #b91c1c; stroke-width: 3; }
    .marker-flow { fill: #52643f; }
    .marker-data { fill: #0369a1; }
    .marker-optional { fill: #6d28d9; }
    .corner { fill: none; stroke: #52643f; stroke-width: 1.8; }
    .legend-line { fill: none; stroke: #52643f; stroke-width: 1.5; }
    .legend-dash { fill: none; stroke: #6d28d9; stroke-width: 1.5; stroke-dasharray: 7 5; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #0d1117; }
      text { fill: #d6dde5; }
      .subtitle, .small { fill: #9aa7b4; }
      .present-text { fill: #34d399; }
      .data-text { fill: #38bdf8; }
      .conditional-text { fill: #fbbf24; }
      .optional-text { fill: #c4b5fd; }
      .absent-text { fill: #f87171; }
      .surface, .absent-box, .ipc { fill: #111820; }
      .surface, .ipc { stroke: #87967a; }
      .frontend { stroke: #34d399; }
      .backend { stroke: #fbbf24; }
      .external, .data-edge { stroke: #38bdf8; }
      .optional-box, .optional-edge, .legend-dash { stroke: #c4b5fd; }
      .absent-box, .barrier { stroke: #f87171; }
      .edge, .corner, .legend-line { stroke: #87967a; }
      .marker-flow { fill: #87967a; }
      .marker-data { fill: #38bdf8; }
      .marker-optional { fill: #c4b5fd; }
    }
  </style>
  <defs>
    <marker id="system-arrow-flow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="marker-flow" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
    <marker id="system-arrow-data" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="marker-data" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
    <marker id="system-arrow-optional" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path class="marker-optional" d="M0 0 L8 4 L0 8 Z"/>
    </marker>
  </defs>

  <rect class="canvas" x="0" y="0" width="1200" height="720"/>
  <path class="corner" d="M18 42 V18 H42 M1158 18 H1182 V42 M18 678 V702 H42 M1182 678 V702 H1158"/>
  <text class="title" x="48" y="42">CREBAIN · CURRENT SYSTEM ARCHITECTURE</text>
  <text class="subtitle" x="48" y="66">CURRENT L0 PRODUCT TOPOLOGY · OBSERVED PATHS AND EXPLICIT ABSENCES</text>

  <rect class="region frontend" x="48" y="92" width="800" height="128"/>
  <text class="region-label present-text" x="66" y="116">FRONTEND · REACT 19 + TYPESCRIPT</text>
  <rect class="surface" x="66" y="132" width="178" height="64"/>
  <text x="155" y="159">SparkJS / Three.js</text>
  <text class="small" x="155" y="179">3D scene</text>
  <rect class="surface" x="260" y="132" width="178" height="64"/>
  <text x="349" y="159">Camera feeds</text>
  <text class="small" x="349" y="179">capture + overlays</text>
  <rect class="surface" x="454" y="132" width="178" height="64"/>
  <text x="543" y="159">Sensor Fusion UI</text>
  <text class="small" x="543" y="179">tracks + status</text>
  <rect class="surface" x="648" y="132" width="182" height="64"/>
  <text x="739" y="159">ROS telemetry UI</text>
  <text class="small" x="739" y="179">read-only status</text>

  <path class="edge" d="M155 220 V246"/>
  <path class="edge" d="M349 220 V246"/>
  <path class="edge" d="M543 220 V246"/>
  <path class="edge" d="M739 220 V246"/>
  <rect class="ipc" x="48" y="252" width="800" height="48"/>
  <text class="conditional-text" x="448" y="282">TAURI IPC · REGISTERED INVOKE / EVENT CONTRACTS</text>
  <path class="edge" d="M155 300 V324"/>
  <path class="edge" d="M349 300 V324"/>
  <path class="edge" d="M543 300 V324"/>
  <path class="edge" d="M739 300 V324"/>

  <rect class="region backend" x="48" y="330" width="800" height="204"/>
  <text class="region-label conditional-text" x="66" y="354">RUST BACKEND · TAURI</text>
  <rect class="surface optional-box" x="66" y="370" width="354" height="76"/>
  <text x="243" y="398">Inference abstraction</text>
  <text class="small" x="243" y="420">CoreML · ONNX · TensorRT · CUDA</text>
  <text class="small optional-text" x="243" y="438">MLX-style Candle path · experimental</text>
  <rect class="surface" x="438" y="370" width="392" height="76"/>
  <text x="634" y="404">Native sensor-fusion engine</text>
  <text class="small" x="634" y="426">bounded measurements + track state</text>
  <rect class="surface" x="66" y="462" width="222" height="54"/>
  <text x="177" y="485">Zenoh transport</text>
  <text class="small data-text" x="177" y="504">default · subscribe only</text>
  <rect class="surface" x="304" y="462" width="238" height="54"/>
  <text x="423" y="485">Native rosbridge fallback</text>
  <text class="small data-text" x="423" y="504">WebSocket · subscribe only</text>
  <rect class="surface optional-box" x="558" y="462" width="272" height="54"/>
  <text x="694" y="485">Galadriel evidence producer</text>
  <text class="small optional-text" x="694" y="504">feature + runtime pins</text>
  <path class="optional-edge" d="M634 446 V456"/>

  <path class="data-edge" d="M177 534 V566"/>
  <path class="data-edge" d="M423 534 V566"/>
  <path class="optional-edge" d="M694 534 V566"/>
  <text class="small data-text" x="300" y="554">SUBSCRIBE ONLY · NO PUBLISH</text>
  <text class="small optional-text" x="694" y="554">LOCAL PUT ≠ DELIVERY</text>

  <rect class="region external" x="48" y="572" width="800" height="104"/>
  <text class="region-label data-text" x="66" y="596">EXTERNAL / DEPLOYMENT-DEPENDENT</text>
  <rect class="surface" x="66" y="610" width="210" height="48"/>
  <text x="171" y="633">Gazebo + sensor sources</text>
  <text class="small" x="171" y="651">headless simulation</text>
  <rect class="surface" x="292" y="610" width="224" height="48"/>
  <text x="404" y="633">ROS / rosbridge server</text>
  <text class="small" x="404" y="651">telemetry source</text>
  <rect class="surface optional-box" x="532" y="610" width="138" height="48"/>
  <text x="601" y="633">2 NCP routes</text>
  <text class="small" x="601" y="651">advisory puts</text>
  <line class="barrier" x1="686" y1="614" x2="686" y2="654"/>
  <rect class="absent-box" x="702" y="610" width="128" height="48"/>
  <text class="absent-text" x="766" y="633">Receiver</text>
  <text class="small absent-text" x="766" y="651">not established</text>

  <rect class="absent-box" x="900" y="242" width="252" height="232"/>
  <text class="region-label absent-text" x="920" y="272">SEPARATE PACKAGE</text>
  <text x="1026" y="312">crebain-plantd</text>
  <text class="small" x="1026" y="338">inert plant foundation</text>
  <text class="small" x="1026" y="360">self-check only · unwired</text>
  <line class="barrier" x1="934" y1="382" x2="1118" y2="382"/>
  <text class="absent-text" x="1026" y="410">NO AUTHORITY PATH</text>
  <text class="small absent-text" x="1026" y="438">No command ingress</text>
  <text class="small absent-text" x="1026" y="458">No FCU adapter</text>

  <line class="legend-line" x1="900" y1="548" x2="944" y2="548"/>
  <text class="small left" x="956" y="553">Solid · current/default path</text>
  <line class="legend-dash" x1="900" y1="578" x2="944" y2="578"/>
  <text class="small left" x="956" y="583">Dashed · gated/optional</text>
  <line class="barrier" x1="920" y1="598" x2="920" y2="626"/>
  <text class="small left absent-text" x="956" y="617">Stop bar · path absent</text>
</svg>
