  <title id="title">NEST networks fly CREBAIN drones to their targets over NCP 2</title>
  <desc id="desc">Three line charts of the distance between each drone's true position and its target, in meters, over 12 seconds of simulated time. Every line falls from its start, between 7.3 and 15.6 m, to between 1.2 and 2.6 cm at the end.</desc>
