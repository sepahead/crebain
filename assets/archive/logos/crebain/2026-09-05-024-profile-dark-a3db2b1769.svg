<svg xmlns="http://www.w3.org/2000/svg" viewBox="382 472 136 136" width="136" height="136" role="img" aria-label="CREBAIN historical profile mark"><title>CREBAIN historical profile mark</title><desc>Archived design extracted from a historical portfolio SVG. This image makes no current product or release claim.</desc><defs><radialGradient id="crebGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#293716" />
      <stop offset="62%" stop-color="#19230f" />
      <stop offset="100%" stop-color="#0d1208" />
    </radialGradient>
    <filter id="hdBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.4" flood-color="#000000" flood-opacity="0.38" />
    </filter>
    </defs><style>.seat-ring{fill: none; stroke-width: 2.2;}
.seat-groove{fill: none; stroke: #05070b; stroke-opacity: 0.5; stroke-width: 1;}
.seat-hairline{fill: none; stroke: #2b333d; stroke-opacity: 0.55; stroke-width: 1;}
.seat-creb{fill: url(#crebGrad);}
.creb-signal{fill: none; stroke: #b6cf86; stroke-opacity: 0.7; stroke-width: 1.2;}
.creb-xhair{fill: none; stroke: #a8c07a; stroke-opacity: 0.7; stroke-width: 1.3; stroke-linecap: round;}
.creb-eye-core{fill: #ff6b5e;}
.creb-eye-hot{fill: #fff1f0;}</style><g class="nodes"><g>
    <defs>
      <linearGradient id="crebBezel" x1="0" y1="506" x2="0" y2="574" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#8ba458" /><stop offset="50%" stop-color="#728a49" /><stop offset="100%" stop-color="#4f612e" />
      </linearGradient>
    </defs>
    <g transform="translate(450 540) scale(1.3) translate(-450 -540)">
      <g filter="url(#nodeShadow)"><circle cx="450" cy="540" r="34" class="seat-creb" /></g>
      <g transform="translate(405 495) scale(0.5)">
  <title id="crebain-mark-title">CREBAIN raven and scope</title>
  <desc id="crebain-mark-desc">An angular raven faces left inside a circular instrument reticle. Its red optical eye projects a narrow scanning beam. A slow tracking sweep follows the ring. Reduced motion keeps the mark still.</desc>
  <style>
    .crebain-laser-scan { animation: crebain-laser-scan 4.8s ease-in-out infinite; transform-origin: 0 0; }
    .crebain-tracking-sweep { animation: crebain-tracking-sweep 11s linear infinite; transform-origin: 0 0; }
    .crebain-optic-pulse { animation: crebain-optic-pulse 4.8s ease-in-out infinite; }
    @keyframes crebain-laser-scan { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes crebain-tracking-sweep { to { transform: rotate(360deg); } }
    @keyframes crebain-optic-pulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .crebain-laser-scan, .crebain-tracking-sweep, .crebain-optic-pulse { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="crebain-laser-energy" x1="-78" y1="24" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fc352b" stop-opacity="0" /><stop offset=".2" stop-color="#ff493b" stop-opacity=".45" /><stop offset="1" stop-color="#ff6b50" stop-opacity=".9" />
    </linearGradient>
    <linearGradient id="crebain-ring-metal" x1="25" y1="20" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79817b" /><stop offset=".27" stop-color="#3d4545" /><stop offset=".64" stop-color="#242b2c" /><stop offset="1" stop-color="#677065" />
    </linearGradient>
    <linearGradient id="crebain-crown-metal" x1="65" y1="42" x2="122" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8c9387" /><stop offset=".38" stop-color="#505a54" /><stop offset="1" stop-color="#20292a" />
    </linearGradient>
    <linearGradient id="crebain-neck-metal" x1="70" y1="90" x2="123" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#535f54" /><stop offset=".52" stop-color="#303a35" /><stop offset="1" stop-color="#171e20" />
    </linearGradient>
    <radialGradient id="crebain-optic-halo">
      <stop stop-color="#ff4437" stop-opacity=".72" /><stop offset=".48" stop-color="#e12520" stop-opacity=".28" /><stop offset="1" stop-color="#d11717" stop-opacity="0" />
    </radialGradient>
  </defs>

