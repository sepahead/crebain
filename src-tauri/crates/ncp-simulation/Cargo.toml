[package]
name = "crebain-ncp-simulation"
authors = ["Sepehr Mahmoudian"]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sepahead/crebain"
description = "Native bounded local NCP responder owning the CREBAIN simulation kernel"
publish = false

[workspace]
resolver = "2"

[dependencies]
crebain-managed-simulation = { path = "../managed-simulation" }
ncp-local = { git = "https://github.com/sepahead/NCP", rev = "99e9adce147fe5bc770d2dcfe5f21cbd2274efeb", version = "=1.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
