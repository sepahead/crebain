[package]
name = "crebain-ncp-simulation"
authors = ["Sepehr Mahmoudian"]
version = "0.2.0"
edition = "2021"
rust-version = "1.91.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sepahead/crebain"
description = "NCP 2 owner of the CREBAIN simulation kernel, a reference controller, and a closed-loop host"
publish = false

[workspace]
resolver = "2"

[[bin]]
name = "crebain-ncp-simulation"
path = "src/main.rs"

[[bin]]
name = "crebain-ncp-controller"
path = "src/bin/controller.rs"

[[bin]]
name = "crebain-ncp-loop"
path = "src/bin/loop.rs"

[dependencies]
crebain-managed-simulation = { path = "../managed-simulation" }
ncp = { package = "sepahead-ncp-core", git = "https://github.com/sepahead/NCP", rev = "2e24ef5b89feb3f1e4f4972e290201d93e2d0a8d", version = "=2.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
