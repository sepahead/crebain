# cargo-deny configuration — supply-chain policy for the Rust backend.
# Run: cargo deny --manifest-path src-tauri/Cargo.toml check

[graph]
# Check the targets CREBAIN actually ships on, so we don't fail on advisories in
# dependency trees for platforms we never build (e.g. unrelated *-windows crates).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = true

[advisories]
version = 2
# Yanked dependencies are release blockers. Keep unused image codecs disabled
# and refresh the lockfile rather than carrying abandoned transitive versions.
yanked = "deny"
# Only fail on *unmaintained* advisories for crates we depend on directly; the
# deep transitive GUI stack pulled in by Tauri on Linux (gtk-rs, etc.) is not
# something this project can fix and is tracked upstream.
unmaintained = "workspace"
ignore = [
    # zip 7.2.0 reaches the graph only through candle-core 0.9.2, which opens archives
    # (ZipArchive::new, by_name, read) and writes .npz files but never calls
    # ZipArchive::extract or ZipStreamReader::extract, the functions these advisories
    # concern. Their fix is zip 9.0.0; no candle-core release accepts it (0.11.0
    # requires ^8.6.0). Remove all three when candle-core accepts zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
# Permissive / OSI-approved licenses present in the dependency tree.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    # Permissive data license (transitive, e.g. webpki-roots certificate data).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Surface accidental duplicate versions without failing the build.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/sepahead/NCP"]
