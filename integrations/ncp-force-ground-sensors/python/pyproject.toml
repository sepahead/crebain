[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crebain-ncp-sensors"
version = "0.1.0"
description = "Typed NCP v1 client for CREBAIN RGB, thermal, and pressure observations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Sepehr Mahmoudian" }]
dependencies = ["ncp-local @ git+https://github.com/sepahead/NCP.git@9ae64ac1a77c9cd0612284992a8711220428a6e3#subdirectory=local/python"]

[project.urls]
Repository = "https://github.com/sepahead/crebain"
Documentation = "https://github.com/sepahead/crebain/tree/main/integrations/ncp-force-ground-sensors/python"
Issues = "https://github.com/sepahead/crebain/issues"

[tool.setuptools.packages.find]
include = ["crebain_ncp_sensors"]

[tool.setuptools.package-data]
crebain_ncp_sensors = ["contracts/*.json", "py.typed"]
